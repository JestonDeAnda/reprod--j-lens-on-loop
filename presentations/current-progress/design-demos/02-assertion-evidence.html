<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>J-Lens 当前进展｜Assertion–Evidence</title>
  <!--
    Direction 02: Assertion–Evidence × Tufte × Nature figure plate
    Assumptions: 会议室投屏；事实截点固定为 2026-10-26 11:08 CST；
    两页均只承担一个判断；所有数值均来自唯一输入 design-spec.md。
  -->
  <style>
    :root{
      --paper:#ffffff;
      --ink:#172026;
      --muted:#5f6b72;
      --hair:#cbd2d5;
      --grid:#e5e9eb;
      --blue:#0072b2;
      --orange:#d55e00;
      --green:#009e73;
      --amber:#c68a00;
      --soft-blue:#eaf4f8;
      --soft-amber:#faf3df;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#dfe3e5}
    body{
      color:var(--ink);
      font-family:"Avenir Next","Helvetica Neue","Noto Sans CJK SC","PingFang SC",sans-serif;
      font-variant-numeric:tabular-nums lining-nums;
    }
    #viewport{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    #deck{
      position:relative;
      width:1920px;
      height:1080px;
      flex:0 0 auto;
      transform-origin:center center;
      background:var(--paper);
      box-shadow:0 16px 60px rgba(26,35,40,.16);
    }
    .slide{
      position:absolute;
      inset:0;
      display:none;
      width:1920px;
      height:1080px;
      overflow:hidden;
      background:var(--paper);
    }
    .slide.active{display:block}
    .top-rule{
      position:absolute;
      left:108px;
      right:108px;
      top:62px;
      height:2px;
      background:var(--ink);
    }
    .eyebrow{
      position:absolute;
      left:108px;
      top:80px;
      color:var(--muted);
      font-size:20px;
      font-weight:650;
      letter-spacing:.10em;
      text-transform:uppercase;
    }
    .date{
      position:absolute;
      right:108px;
      top:80px;
      color:var(--muted);
      font-size:20px;
      letter-spacing:.04em;
    }
    h1,h2,p{margin:0}
    .assertion{
      font-family:"Iowan Old Style","Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;
      font-weight:600;
      letter-spacing:-.025em;
      text-wrap:balance;
    }
    .source{
      position:absolute;
      left:108px;
      bottom:48px;

      font-size:20px;

      position:absolute;
      right:108px;

    /* Slide 1 */

      left:108px;
      top:154px;
      width:1585px;

      left:108px;
      top:442px;

    }
    .phase-line{

      left:78px;
      right:78px;

      background:var(--hair);
    }
    .phase-line::before{
      content:"";
      position:absolute;
      left:0;

      height:3px;
      background:var(--green);
    }
    .phase-line::after{
      content:"";
      position:absolute;
      left:58%;
      width:18%;

      background:var(--blue);
    }
    .phase{
      position:absolute;
      top:126px;
      width:300px;

    }
    .phase::after{

      position:absolute;
      left:50%;
      top:57px;

    .phase-kicker{

    }

      font-weight:680;

    }
    .phase-note{
      position:absolute;
      top:224px;
      width:330px;

      text-align:center;
      font-size:22px;

    .n1{left:8%}.n2{left:31%}.n3{left:58%}.n4{left:82%}
    .open-items{
      position:absolute;
      left:1196px;
      top:322px;
      color:var(--orange);
      font-size:20px;
      font-weight:650;
      letter-spacing:.02em;
    }

    .dot{

    .d11{left:72.5%;top:139px}.d12{left:20.9%;top:139px}

      display:block;
      margin-top:4px;

    }
    .v11{left:72.5%;top:74px}.v12{left:20.9%;top:74px}
    .v21{left:21%;top:371px}.v22{left:73.6%;top:371px}
    .legend{
      position:absolute;
      left:324px;
      top:10px;
      display:flex;
      gap:42px;
      font-size:20px;
      font-weight:650;
    }
    .legend-item{display:flex;align-items:center;gap:10px}
    .legend-dot{width:13px;height:13px;border-radius:50%}
    .legend-dot.ouro{background:var(--orange)}

    .axis-title{
      position:absolute;
      left:324px;
      right:42px;
      bottom:0;

      text-align:center;

    }
    .evidence-note{
      position:absolute;
      right:0;
      top:1px;
      color:var(--muted);
      font-family:"Iowan Old Style","Songti SC","STSong",Georgia,serif;
      font-size:20px;

    }
    .n-label{
      position:absolute;
      left:0;
      color:var(--muted);
      font-size:20px;

    .nl1{top:199px}.nl2{top:410px}
    .convergence{
      position:absolute;

      color:var(--green);

    .help{
      position:fixed;
      right:18px;
      bottom:14px;
      z-index:5;
      color:#68737a;
      font-size:12px;
      opacity:.62;
      user-select:none;
    }
    @media print{
      html,body{overflow:visible;background:#fff}
      #viewport{position:static;display:block}
      #deck{width:1920px;height:auto;transform:none!important;box-shadow:none}
      .slide{position:relative;display:block!important;page-break-after:always}
      .help{display:none}
    }
  </style>
</head>
<body>
  <div id="viewport">
    <main id="deck" aria-label="J-Lens 当前进展两页展示">

        <div class="top-rule"></div>

        <h1 class="assertion" id="cover-title">
          拟合主体基本完成，工作已进入结构分析；<span class="caution">但三处关键链路仍未闭合。</span>
        </h1>

        <figure class="cover-figure" aria-label="项目由拟合进入结构分析，但归档、tiling 与语义协议尚未闭环">
          <div class="phase-line"></div>

          </div>

            <div class="phase-kicker">当前证据等级</div>
            <div class="phase-name">初步信号</div>
          </div>
          <div class="phase open p4">
            <div class="phase-kicker">尚不能宣称</div>

          </div>

          <div class="phase-note n1">

            Ouro full 4/4 · Huginn primary 4/4<br>Nanbeige full 2/2

          <div class="phase-note n2">

          <div class="phase-note n4">

        <div class="counter" aria-hidden="true">01 / 02</div>
      </section>

      <section class="slide analysis" aria-labelledby="analysis-title">
        <div class="top-rule"></div>
        <div class="eyebrow">结构分析 · 首批结果</div>
        <div class="date">中位数 · 相对算子误差</div>

            <div class="dot ouro d11"></div>

            <div class="value ouro v11">0.725<small>Ouro</small></div>

        </figure>

        <div class="source"><strong>来源：</strong>DSW 结构分析输出 6 个 JSON；本页仅报告可追溯的中位数与记录数。</div>
        <div class="counter" aria-hidden="true">02 / 02</div>
      </section>
    </main>
  </div>
  <div class="help">← → / Space · Home / End · F 全屏</div>

  <script>
    (() => {
      const deck = document.getElementById('deck');
      const slides = [...document.querySelectorAll('.slide')];
      const hashIndex = Number(location.hash.replace('#','')) - 1;
      let index = Number.isInteger(hashIndex) && hashIndex >= 0
        ? hashIndex
        : Number(localStorage.getItem('jlens-ae-slide') || 0);
      index = Math.max(0, Math.min(slides.length - 1, index));

      function render() {
        slides.forEach((slide, i) => slide.classList.toggle('active', i === index));
        localStorage.setItem('jlens-ae-slide', String(index));
        document.title = `J-Lens 当前进展｜${index + 1}/${slides.length}`;
      }
      function fit() {
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        deck.style.transform = `scale(${scale})`;
      }
      function go(next) {
        index = Math.max(0, Math.min(slides.length - 1, next));
        render();
      }
      window.addEventListener('resize', fit, {passive:true});
      window.addEventListener('keydown', (event) => {
        if (['ArrowRight','PageDown',' '].includes(event.key)) {
          event.preventDefault();
          go(index + 1);
        } else if (['ArrowLeft','PageUp'].includes(event.key)) {
          event.preventDefault();
          go(index - 1);
        } else if (event.key === 'Home') {
          event.preventDefault();
          go(0);
        } else if (event.key === 'End') {
          event.preventDefault();
          go(slides.length - 1);
        } else if (event.key.toLowerCase() === 'f') {
          document.documentElement.requestFullscreen?.();
        }
      });
      fit();
      render();
      window.__deckReady = true;
    })();
  </script>
</body>
